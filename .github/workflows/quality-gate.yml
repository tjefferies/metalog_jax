# Consolidated quality checks - all run in parallel
# Equivalent to GitLab stages: lint, typing, test, docs, license, sast, sbom
#
# Runs for every pull request, and as the first stage of the release in publish.yml,
# which calls it on the commit pushed to main. Start it by hand on any branch with
# `gh workflow run quality-gate.yml --ref <branch>`. Actions are pinned to commit
# hashes; Dependabot updates them.
name: Quality Gate

on:
  pull_request:
    branches: [main, development]
  # By hand, for a branch that has no pull request
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

env:
  UV_CACHE_DIR: .uv-cache

jobs:
  # === SETUP ===

  python-versions:
    # The Python versions to test are the ones the classifiers in pyproject.toml
    # declare. The pytest matrix reads them here, so adding a classifier adds a test
    # run.
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.classifiers.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false

      - name: Read the Python classifiers
        id: classifiers
        shell: python
        run: |
          import json
          import os
          import re
          import tomllib

          with open("pyproject.toml", "rb") as f:
              classifiers = tomllib.load(f)["project"]["classifiers"]
          pattern = r"Programming Language :: Python :: (3\.\d+)"
          matches = (re.fullmatch(pattern, c) for c in classifiers)
          versions = sorted((m[1] for m in matches if m), key=lambda v: int(v[2:]))
          if not versions:
              raise SystemExit("pyproject.toml has no Programming Language :: Python :: 3.x classifiers")
          print("Python versions:", versions)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"versions={json.dumps(versions)}\n")

  # === LINT STAGE ===

  ruff:
    # Equivalent to: stages/lint.yml → ruff job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check metalog_jax/ tests/

      - name: Run linter
        run: uv run ruff check metalog_jax/ tests/

  radon:
    # Equivalent to: stages/lint.yml → radon job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-groups

      - name: Maintainability Index
        run: uv run radon mi metalog_jax/ -s

      - name: Cyclomatic Complexity
        run: uv run radon cc metalog_jax/ -s --average

      - name: Check MI Grade A
        run: |
          uv run radon mi metalog_jax/ -s > /tmp/mi_output.txt 2>&1 || true
          if grep -E "^metalog_jax.* - [B-F]" /tmp/mi_output.txt; then
            echo "ERROR: Found files with Maintainability Index below Grade A"
            exit 1
          fi
          echo "All files have Grade A maintainability!"

      - name: Check CC Grade A/B
        run: |
          uv run radon cc metalog_jax/ -s > /tmp/cc_output.txt 2>&1 || true
          if grep -E " - [C-F] " /tmp/cc_output.txt; then
            echo "ERROR: Found functions with Cyclomatic Complexity Grade C or worse"
            exit 1
          fi
          echo "All functions have Grade A or B complexity!"

  xenon:
    # Fails on complexity thresholds: no block worse than B, modules and average A
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-groups

      - name: Check complexity thresholds
        run: uv run xenon --max-absolute B --max-modules A --max-average A metalog_jax/

  interrogate:
    # Docstring coverage; threshold in [tool.interrogate] in pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-groups

      - name: Check docstring coverage
        run: uv run interrogate metalog_jax/

  pydoclint:
    # Google-style docstring checks; config in [tool.pydoclint] in pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-groups

      - name: Check docstrings
        run: uv run pydoclint metalog_jax/

  zizmor:
    # Security audit of the GitHub Actions workflows and Dependabot config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-groups

      - name: Audit workflows
        run: uv run zizmor --offline .github/

  # === TYPING STAGE ===

  ty:
    # Equivalent to: stages/typing.yml → ty job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-groups

      - name: Type check
        run: uv run ty check

  # === TEST STAGE ===

  pytest:
    # Equivalent to: stages/test.yml → pytest job
    # Every supported Python. Coverage is measured on one version, the one that
    # uploads to Codecov (settings in [tool.coverage] in pyproject.toml); on 3.11
    # it traces with sys.settrace, which made that job the slowest.
    needs: python-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-versions.outputs.versions) }}
    env:
      COVERAGE_PYTHON: "3.12"
      # JAX's persistent compilation cache, kept between runs by actions/cache.
      # Cache every compilation, not only those over a second; the suite writes
      # about 50 MB. (Capping it with JAX_COMPILATION_CACHE_MAX_SIZE needs the
      # filelock package, which isn't installed; without it nothing is cached.)
      JAX_COMPILATION_CACHE_DIR: .jax-cache
      JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-groups

      - name: Restore JAX compilations
        # Saves a new entry every run, restored from the latest one for the same
        # lock file and Python, so a new uv.lock starts an empty cache. A run reads
        # only its own branch's or pull request's caches and the default branch's,
        # so a pull request's first run starts cold.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jax-cache
          key: jax-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: jax-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-

      - name: Run tests with coverage
        if: matrix.python-version == env.COVERAGE_PYTHON
        run: |
          uv run pytest tests/ --durations=30 \
            --cov=metalog_jax \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-report=html:coverage_html

      - name: Run tests
        if: matrix.python-version != env.COVERAGE_PYTHON
        run: uv run pytest tests/ --durations=30

      - name: Upload coverage to Codecov
        if: matrix.python-version == env.COVERAGE_PYTHON
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage HTML artifact
        if: matrix.python-version == env.COVERAGE_PYTHON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: coverage_html/

  doctest:
    # Every docstring example runs as written
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-groups

      - name: Run docstring examples
        run: uv run pytest --doctest-modules metalog_jax/

  lowest-deps:
    # The oldest supported Python with the lowest versions pyproject.toml allows for
    # direct dependencies (jax, flax, chex, plotly, and the test tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Test with the lowest allowed dependency versions
        run: uv run --isolated --resolution lowest-direct --python 3.11 --group test pytest tests/ --durations=30

  # === DOCS STAGE ===

  docs:
    # The Sphinx build fails on any warning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-groups

      - name: Build documentation
        run: |
          cd docs
          uv run sphinx-build -W --keep-going -b html source build/html

  notebooks:
    # The docs build shows stored notebook outputs; this checks they still run.
    # Copies run in a temp directory because basic_usage writes PNGs beside itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-groups

      - name: Execute notebooks
        run: |
          export JUPYTER_DATA_DIR="$RUNNER_TEMP/jupyter" JUPYTER_PATH="$RUNNER_TEMP/jupyter"
          uv run python -m ipykernel install --user --name metalog_jax
          cp docs/source/*.ipynb "$RUNNER_TEMP/"
          for nb in "$RUNNER_TEMP"/*.ipynb; do
            uv run jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/executed" "$nb"
          done

  # === LICENSE STAGE ===

  license-check:
    # Equivalent to: stages/license.yml → license-check job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-groups

      - name: Check licenses
        run: |
          echo "=== License Compliance Check ==="

          # Runtime dependencies only: the base install from uv.lock, without dependency
          # groups (dev/docs/security tools) or the gpu extra (NVIDIA CUDA wheels)
          RUNTIME_PKGS=$(uv export --frozen --no-default-groups --no-emit-project --no-hashes --no-header --no-annotate --format requirements.txt | sed -E 's/[ =;].*//' | sort -u)
          test -n "$RUNTIME_PKGS" || { echo "::error::uv export listed no runtime packages"; exit 1; }

          # --packages requires a space-separated list
          uv run pip-licenses --format=markdown --packages $RUNTIME_PKGS

          ALLOWED="MIT;BSD;Apache;PSF;Python Software Foundation;ISC;Unlicense;Public Domain;CC0;Zlib;Historical Permission Notice and Disclaimer;Mozilla Public License;Academic Free License;0BSD"
          uv run pip-licenses --packages $RUNTIME_PKGS --partial-match --allow-only="${ALLOWED}"

          echo "All runtime dependencies have approved licenses!"

  # === SAST STAGE ===

  semgrep:
    # Equivalent to: stages/sast.yml → semgrep job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-groups

      - name: Run Semgrep scan
        run: |
          uv run semgrep scan \
            --config=p/python \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/cwe-top-25 \
            --config=p/secrets \
            --config=.semgrep.yml \
            --json --output=semgrep-results.json \
            --no-git-ignore metalog_jax/ || true

      - name: Check for high severity issues
        run: |
          uv run semgrep scan \
            --config=p/python \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/cwe-top-25 \
            --config=p/secrets \
            --config=.semgrep.yml \
            --severity=ERROR --error \
            --no-git-ignore metalog_jax/

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json

  bandit:
    # Equivalent to: stages/sast.yml → bandit job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-groups

      - name: Run Bandit scan
        run: |
          uv run bandit -r metalog_jax/ -f json -o bandit-results.json \
            --severity-level medium --confidence-level medium || true
          uv run bandit -r metalog_jax/ -f txt \
            --severity-level medium --confidence-level medium

      - name: Check for high severity issues
        run: |
          uv run bandit -r metalog_jax/ \
            --severity-level high --confidence-level high -q

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bandit-results
          path: bandit-results.json

  # === SBOM STAGE ===

  sbom:
    # Equivalent to: stages/sbom.yml → sbom job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-groups

      # Each action installs the tool release it pins (Syft v1.54.0 and Grype v0.118.0
      # at these commits) with the install script from that release's tag, which
      # checks the archive against the release's checksums. Dependabot's
      # github-actions entry updates them, so its cooldown covers the tools too.
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      - name: Generate SBOM (CycloneDX)
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: '"$SYFT" scan dir:.venv -o cyclonedx-json=sbom-cyclonedx.json'

      - name: Generate SBOM (SPDX)
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: '"$SYFT" scan dir:.venv -o spdx-json=sbom-spdx.json'

      - name: Scan for vulnerabilities
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          "$GRYPE" sbom:sbom-cyclonedx.json -o json > grype-vulnerabilities.json || true
          "$GRYPE" sbom:sbom-cyclonedx.json -o table || true

      - name: Check for critical vulnerabilities
        run: |
          CRITICAL=$(python3 -c "import json; data=json.load(open('grype-vulnerabilities.json')); print(sum(1 for m in data.get('matches', []) if m.get('vulnerability', {}).get('severity', '').upper() == 'CRITICAL'))" 2>/dev/null || echo "0")
          if [ "${CRITICAL}" -gt 0 ]; then
            echo "ERROR: Critical vulnerabilities found!"
            exit 1
          fi
          echo "No critical vulnerabilities found."

      - name: Upload SBOM reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom-reports
          path: |
            sbom-cyclonedx.json
            sbom-spdx.json
            grype-vulnerabilities.json

  # === GATE JOB ===

  quality-gate:
    # This job only passes if ALL parallel jobs succeed. Pull requests require it as
    # the quality-gate status check; in a release, Build waits for it. The ruleset on
    # main requires it by this job id, so don't rename it or give it a name.
    #
    # Without an if:, a failed check would skip this job rather than fail it, and
    # GitHub counts a skipped required check as passing. always() rather than
    # !cancelled(), so a cancelled run fails the check too instead of skipping it.
    # A skipped job counts as a failure, since none of the jobs above should skip.
    needs: [python-versions, ruff, radon, xenon, interrogate, pydoclint, zizmor, ty, pytest, doctest, lowest-deps, docs, notebooks, license-check, semgrep, bandit, sbom]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All quality checks passed
        shell: python
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          import json
          import os

          needs = json.loads(os.environ["NEEDS"])
          failed = {job: need["result"] for job, need in needs.items() if need["result"] != "success"}
          for job, result in failed.items():
              print(f"::error::{job} ended with: {result}")
          if failed:
              raise SystemExit(f"{len(failed)} of {len(needs)} quality checks didn't succeed")
          print("All quality checks passed successfully!")
