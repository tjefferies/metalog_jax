# Equivalent to: stages/publish.yml → publish job
# Depends on Build workflow completing successfully
# Downloads the wheel artifact produced by build
# Runs in parallel with docs.yml
name: Publish

on:
  # Guarded below: only release-chain Build runs from this repository proceed
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Build]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only a successful Build that the release chain started (push → Docker → Quality
    # Gate → Build) in this repository; never a pull request build, whose branch can
    # also be named main.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download wheel artifact from Build workflow
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          workflow: build.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: dist
          path: dist

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
