# The release. Runs when a push to main changes Dockerfile, pyproject.toml or uv.lock
# (a release bumps the version), or by hand with workflow_dispatch on main:
#
#   Quality Gate → Build → Publish (PyPI)
#                        → Documentation (GitHub Pages)
#                → Docker (GHCR)
#
# Every stage is a job in this one run, so all of them use the commit pushed to main
# (github.sha). The stages used to be separate workflows chained by workflow_run. A
# workflow_run run executes on the default branch, so once development became the
# default branch, the chain lost main's commit after its first hop and stopped
# before Build.
#
# The publish job stays in this file, publish.yml, because PyPI's trusted publisher
# is configured for it and a reusable workflow can't be a trusted publisher
# (https://docs.pypi.org/trusted-publishers/troubleshooting/).
name: Release

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - pyproject.toml
      - uv.lock
  # Re-run a release from main, for example after a stage failed
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

# $/ is GitHub's self-repository syntax: a workflow in this repository at the commit
# that's running, so every stage runs the definitions pushed to main.
jobs:
  quality-gate:
    # workflow_dispatch can run on any branch; release only from main. Every other
    # job needs this one, so they're skipped too.
    if: github.ref == 'refs/heads/main'
    uses: $/.github/workflows/quality-gate.yml
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: quality-gate
    uses: $/.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the dist artifact from Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  docs:
    needs: build
    uses: $/.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  docker:
    needs: quality-gate
    uses: $/.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
