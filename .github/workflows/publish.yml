# Equivalent to: stages/publish.yml → publish job
# Depends on Build workflow completing successfully
# Downloads the wheel artifact produced by build
# Runs in parallel with docs.yml
name: Publish

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only run if build succeeded
    if: github.event.workflow_run.conclusion == 'success'
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download wheel artifact from Build workflow
        uses: dawidd6/action-download-artifact@v24
        with:
          workflow: build.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: dist
          path: dist

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
