# Equivalent to: stages/build.yml → build job
# Depends on quality-gate workflow completing successfully
name: Build

on:
  workflow_run:
    workflows: [Quality Gate]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Only run if quality-gate succeeded (for workflow_run trigger)
    # Always run for pull_request (quality-gate runs in same PR)
    if: |
      github.event_name == 'pull_request' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v7

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
