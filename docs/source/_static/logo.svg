<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <!-- JAX-inspired gradient (purple to teal) -->
    <linearGradient id="jaxGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for the fit line -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect for the line -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="#0f172a" rx="12"/>
  
  <!-- Subtle grid pattern suggesting computation -->
  <g opacity="0.1" stroke="#6366f1" stroke-width="0.5">
    <line x1="30" y1="30" x2="30" y2="140"/>
    <line x1="70" y1="30" x2="70" y2="140"/>
    <line x1="110" y1="30" x2="110" y2="140"/>
    <line x1="150" y1="30" x2="150" y2="140"/>
    <line x1="30" y1="50" x2="150" y2="50"/>
    <line x1="30" y1="85" x2="150" y2="85"/>
    <line x1="30" y1="120" x2="150" y2="120"/>
  </g>
  
  <!-- Scatter points for bimodal distribution - Left mode -->
  <g fill="#94a3b8" opacity="0.6">
    <!-- Left cluster -->
    <circle cx="45" cy="58" r="3"/>
    <circle cx="52" cy="52" r="3"/>
    <circle cx="58" cy="48" r="3"/>
    <circle cx="63" cy="45" r="3"/>
    <circle cx="70" cy="42" r="3"/>
    <circle cx="48" cy="62" r="3"/>
    <circle cx="55" cy="55" r="3"/>
    <circle cx="67" cy="47" r="3"/>
    <circle cx="75" cy="45" r="3"/>
    <circle cx="60" cy="50" r="3"/>
    <circle cx="72" cy="44" r="3"/>
    <circle cx="50" cy="58" r="3"/>
    
    <!-- Valley between modes -->
    <circle cx="85" cy="65" r="3"/>
    <circle cx="90" cy="70" r="3"/>
    <circle cx="95" cy="72" r="3"/>
    
    <!-- Right cluster -->
    <circle cx="105" cy="68" r="3"/>
    <circle cx="112" cy="55" r="3"/>
    <circle cx="118" cy="48" r="3"/>
    <circle cx="125" cy="45" r="3"/>
    <circle cx="130" cy="50" r="3"/>
    <circle cx="135" cy="58" r="3"/>
    <circle cx="140" cy="68" r="3"/>
    <circle cx="120" cy="52" r="3"/>
    <circle cx="127" cy="47" r="3"/>
    <circle cx="115" cy="52" r="3"/>
    <circle cx="122" cy="46" r="3"/>
    <circle cx="132" cy="52" r="3"/>
  </g>
  
  <!-- Metalog fit line - smooth bimodal curve -->
  <path d="M 35 85 
           Q 45 82, 55 60 
           Q 62 45, 70 42 
           Q 80 42, 90 72 
           Q 95 78, 100 72
           Q 108 55, 120 45
           Q 130 42, 138 55
           Q 145 70, 155 90" 
        fill="none" 
        stroke="url(#lineGradient)" 
        stroke-width="3.5" 
        stroke-linecap="round"
        filter="url(#glow)"/>
  
  <!-- Axis lines -->
  <line x1="30" y1="140" x2="160" y2="140" stroke="#475569" stroke-width="1.5"/>
  <line x1="30" y1="35" x2="30" y2="140" stroke="#475569" stroke-width="1.5"/>
  
  <!-- Small axis ticks -->
  <g stroke="#475569" stroke-width="1">
    <line x1="30" y1="140" x2="30" y2="145"/>
    <line x1="70" y1="140" x2="70" y2="145"/>
    <line x1="110" y1="140" x2="110" y2="145"/>
    <line x1="150" y1="140" x2="150" y2="145"/>
  </g>
  
  <!-- JAX acceleration indicator - diagonal speed lines -->
  <g stroke="url(#jaxGradient)" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="145" y1="35" x2="160" y2="50"/>
    <line x1="150" y1="35" x2="165" y2="50"/>
    <line x1="155" y1="35" x2="170" y2="50"/>
  </g>
  
  <!-- Text: metalog_jax -->
  <text x="185" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="url(#jaxGradient)">metalog-jax</text>
  
  <!-- Accent underline -->
  <g fill="url(#jaxGradient)" opacity="0.8">
    <rect x="185" y="105" width="40" height="2" rx="1"/>
    <rect x="230" y="105" width="12" height="2" rx="1"/>
  </g>
  
  <!-- Tagline -->
  <text x="185" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">scipy.stats compatible • pure JAX</text>
  
  <!-- Subtle corner accents suggesting array/matrix operations -->
  <g stroke="url(#jaxGradient)" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M 12 12 L 12 25 M 12 12 L 25 12"/>
    <path d="M 388 12 L 388 25 M 388 12 L 375 12"/>
    <path d="M 12 188 L 12 175 M 12 188 L 25 188"/>
    <path d="M 388 188 L 388 175 M 388 188 L 375 188"/>
  </g>
</svg>
